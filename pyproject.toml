[project]
name = "demeter"
version = "0.1.0"
description = "Rent-roll pipeline for Harbourline Lending (fictional): land, reconcile, model, trace."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.164.0",
    "uvicorn==0.54.0",
    "duckdb==1.1.3",
    "pydantic==2.14.3",
    "python-multipart==0.0.34",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.17.5",
]

[project.scripts]
demeter = "demeter.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["demeter"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "pyproject.toml"]
extend-exclude = ["tools/privacy_guard.py", "tools/hooks"]  # shared kit files, kept identical across projects

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/demeter/model/warehouse.py" = ["S608"]  # table/column names are code constants, values are bound
