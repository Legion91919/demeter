name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests with coverage (contracts, rules, pipeline, API, boundaries; 80% gate, ratchet up only)
        run: pytest --cov --cov-report=term --cov-fail-under=80

      - name: Samples are reproducible
        run: |
          python tools/make_samples.py
          git diff --exit-code samples/

      - name: Vulnerable packages
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.lock

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Privacy guard (secrets + personal data)
        run: python3 tools/privacy_guard.py --all

  handover-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install arch-advisor
        run: |
          git clone --depth 1 https://github.com/${{ vars.KIT_REPO || 'Legion91919/agentic-engineering-kit' }} /tmp/kit
          dotnet pack /tmp/kit/src/ArchAdvisor.Mcp -c Release -o /tmp/nupkg
          dotnet tool install -g arch-advisor --add-source /tmp/nupkg
      - name: Handover readiness (min 80%)
        run: arch-advisor check . --min 80
