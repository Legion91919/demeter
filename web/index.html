<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbourline portfolio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%230b5d6b'/%3E%3Cpath d='M7 6v14M19 6v14M7 12h12' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#fff"/><path d="M7 6v14M19 6v14M7 12h12" stroke="#0b5d6b" stroke-width="2.6" stroke-linecap="round"/><path d="M4 21c3-2 6 2 9 0s6 2 9 0" stroke="#00809a" stroke-width="1.6" fill="none"/></svg>
      <b>Harbourline</b><span>Portfolio</span>
      <span id="freshness" class="fresh" aria-live="polite">Checking data&hellip;</span>
    </header>
    <main>
      <section id="kpis" class="kpis" aria-label="Portfolio summary"></section>
      <section class="card" aria-labelledby="t-prop">
        <h2 id="t-prop">Which properties are let, and for how much? <span class="muted">(latest roll per borrower)</span></h2>
        <div id="properties"></div>
      </section>
      <aside class="card" aria-labelledby="t-up">
        <h2 id="t-up">Load a rent roll</h2>
        <form id="upload" class="drop">
          <label for="file">Borrower rent roll (CSV)</label>
          <input id="file" name="file" type="file" accept=".csv,text/csv" required />
          <button class="primary" type="submit">Load file</button>
        </form>
        <div id="upload-result" aria-live="polite"></div>
        <h2 id="t-lineage" class="gap">Trace a figure</h2>
        <div id="lineage"><p class="muted">Select a property to trace its figures.</p></div>
      </aside>
      <section class="card wide" aria-labelledby="t-runs">
        <h2 id="t-runs">Job runs</h2>
        <div id="runs"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
